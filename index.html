<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ALT HUNTER v0.5</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#07111f;color:#eef5ff;min-height:100vh;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:20px}
  h1{margin:0;font-size:28px;letter-spacing:.5px}
  .sub{color:#8ea2bd;font-size:13px;margin-top:5px}
  .status{font-size:12px;padding:7px 10px;border:1px solid #26384f;border-radius:999px;color:#b8c7d9;white-space:nowrap}
  .status.live{border-color:#1d7456;color:#7de2b6}
  .panel{
    background:#0c1828;border:1px solid #1f3045;border-radius:18px;padding:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);margin-bottom:14px
  }
  .hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hero strong{font-size:17px}
  .hero small{color:#91a6c0}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:12px;border-radius:999px;padding:6px 9px;background:#132238;color:#afc2da}
  .grid{display:grid;gap:10px}
  .card{
    background:#0c1828;border:1px solid #1f3045;border-radius:16px;padding:15px;
  }
  .card.hot{border-color:#b26c24;box-shadow:0 0 0 1px rgba(178,108,36,.12) inset}
  .card.watch{border-color:#256b78}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .coin{font-size:20px;font-weight:800;letter-spacing:.4px}
  .tag{font-size:12px;padding:5px 8px;border-radius:999px;background:#15263a;color:#b8c7d9}
  .tag.hot{background:#3a2413;color:#ffd08c}
  .tag.watch{background:#10313a;color:#82e0ee}
  .price{font-size:22px;font-weight:750;margin-top:10px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .metric{background:#101f31;border-radius:12px;padding:9px}
  .metric span{display:block;color:#7f95b0;font-size:11px;margin-bottom:4px}
  .metric b{font-size:14px}
  .reason{margin-top:11px;color:#c8d7e8;font-size:13px;line-height:1.5}
  .muted{color:#7890ad}
  .empty{text-align:center;padding:24px 12px;color:#8298b2;line-height:1.7}
  .footer{margin-top:18px;color:#6f849e;font-size:11px;line-height:1.6}
  .count{font-variant-numeric:tabular-nums}
  @media(max-width:520px){
    .metrics{grid-template-columns:1fr 1fr}
    .metric:last-child{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>ALT HUNTER</h1>
      <div class="sub">日本で買えるアルトの「異変」だけを見る v0.5</div><div id="diag" class="sub" style="margin-top:3px;font-size:11px">起動しています…</div>
    </div>
    <div id="status" class="status">接続中…</div>
  </div>

  <div class="panel">
    <div class="hero">
      <div>
        <strong>🔥 異変レーダー</strong><br>
        <small>Coincheck公開WebSocketだけで高速スタート</small>
      </div>
      <div class="count"><span id="pairCount">0</span>銘柄</div>
    </div>
    <div class="legend">
      <div class="chip">2分出来高 ≥ 2.0倍</div>
      <div class="chip">2分価格 ≥ +1.0%</div>
      <div class="chip">BTC / ステーブル系除外</div>
    </div>
  </div>

  <div id="signals" class="grid"></div>

  <div class="panel">
    <div class="row">
      <strong>👀 動き上位</strong>
      <span class="muted" style="font-size:12px">異変未満も表示</span>
    </div>
    <div id="watch" class="grid" style="margin-top:10px"></div>
  </div>

  <div class="footer">
    これは売買推奨ではなく、チャートを開く候補を探すレーダーです。v0.5はWeb公開前提の安定版です。<br>
    最初の約2〜4分は基準値を作るため「準備中」になります。ページを閉じると監視も止まります。
  </div>
</div>

<script>
(() => {
  const ALL = [
    "eth_jpy","etc_jpy","lsk_jpy","xrp_jpy","xem_jpy","bch_jpy","mona_jpy",
    "iost_jpy","chz_jpy","imx_jpy","shib_jpy","avax_jpy","fnct_jpy","bril_jpy",
    "doge_jpy","pepe_jpy","mask_jpy","mana_jpy","trx_jpy","grt_jpy","sol_jpy",
    "fpl_jpy","sui_jpy"
  ];

  const state = {};
  const MAX_MS = 12 * 60 * 1000;
  const MIN_BASELINE_MS = 2 * 60 * 1000;
  const VOL_TRIGGER = 2.0;
  const PRICE_TRIGGER = 1.0;

  const $ = id => document.getElementById(id);
  $("pairCount").textContent = ALL.length;
  $("diag").textContent = `監視対象 ${ALL.length}銘柄を準備中`;

  for (const pair of ALL) state[pair] = {trades:[], last:null, firstSeen:null};

  function fmtPrice(v){
    if(v == null) return "—";
    if(v >= 1000) return "¥" + Math.round(v).toLocaleString("ja-JP");
    if(v >= 1) return "¥" + v.toLocaleString("ja-JP",{maximumFractionDigits:4});
    return "¥" + v.toLocaleString("ja-JP",{maximumSignificantDigits:5});
  }
  function pct(v){
    if(v == null || !isFinite(v)) return "—";
    return (v >= 0 ? "+" : "") + v.toFixed(2) + "%";
  }
  function mult(v){
    if(v == null || !isFinite(v)) return "—";
    return v.toFixed(2) + "倍";
  }
  function label(pair){ return pair.split("_")[0].toUpperCase(); }

  function addTrade(pair, ts, price, amount){
    if(!state[pair]) return;
    const s = state[pair];
    const t = ts * 1000;
    const now = Date.now();
    if(!s.firstSeen) s.firstSeen = now;
    s.last = price;
    s.trades.push({t, price, yen:price*amount});
    const cutoff = now - MAX_MS;
    while(s.trades.length && s.trades[0].t < cutoff) s.trades.shift();
  }

  function calc(pair){
    const s = state[pair], now = Date.now(), tr = s.trades;
    if(!tr.length) return {pair, ready:false, last:s.last};

    // 直近2分出来高
    const vol2 = tr
      .filter(x => x.t >= now - 2*60_000)
      .reduce((a,x)=>a+x.yen,0);

    // その前の最大6分を2分バケットに分けて平均化
    const buckets = [];
    for(let i=1;i<=3;i++){
      const end = now - i*2*60_000;
      const start = end - 2*60_000;
      if(start >= (s.firstSeen || now)){
        const bucketVol = tr
          .filter(x => x.t >= start && x.t < end)
          .reduce((a,x)=>a+x.yen,0);
        buckets.push(bucketVol);
      }
    }

    const nonEmpty = buckets.filter(v => v > 0);
    const baseline = nonEmpty.length
      ? nonEmpty.reduce((a,v)=>a+v,0) / nonEmpty.length
      : 0;
    const ratio = baseline > 0 ? vol2 / baseline : null;

    // 2分騰落率
    const older2 = [...tr].reverse().find(x => x.t <= now-2*60_000);
    const change2 = older2 && s.last ? (s.last/older2.price-1)*100 : null;

    // 10分高値まで
    const tr10 = tr.filter(x => x.t >= now-10*60_000);
    const high10 = tr10.length ? Math.max(...tr10.map(x=>x.price)) : null;
    const toHigh = s.last && high10 ? (high10/s.last-1)*100 : null;

    const span = now - (s.firstSeen || now);
    const ready = span >= MIN_BASELINE_MS && nonEmpty.length >= 1 && ratio != null && change2 != null;
    const hot = ready && ratio >= VOL_TRIGGER && change2 >= PRICE_TRIGGER;

    return {pair, ready, hot, last:s.last, ratio, change5:change2, toHigh, vol2};
  }

  function card(d, type){
    const cls = type === "hot" ? "hot" : "watch";
    const tag = d.hot ? "🔥 異変" : d.ready ? "👀 監視" : "準備中";
    const reason = d.hot
      ? `直近2分の売買が普段より増え、価格も上向いています。まずチャートを確認。`
      : d.ready
        ? `まだ異変条件には届いていません。`
        : `基準値を作っています。`;

    return `
      <div class="card ${cls}">
        <div class="row">
          <div class="coin">${label(d.pair)}</div>
          <div class="tag ${cls}">${tag}</div>
        </div>
        <div class="price">${fmtPrice(d.last)}</div>
        <div class="metrics">
          <div class="metric"><span>直近2分出来高</span><b>${d.ready ? mult(d.ratio) : "—"}</b></div>
          <div class="metric"><span>2分価格</span><b>${d.ready ? pct(d.change5) : "—"}</b></div>
          <div class="metric"><span>10分高値まで</span><b>${d.ready && d.toHigh!=null ? d.toHigh.toFixed(2)+"%" : "—"}</b></div>
        </div>
        <div class="reason">${reason}</div>
      </div>`;
  }

  function render(){
    const arr = ALL.map(calc);
    const hot = arr.filter(x=>x.hot).sort((a,b)=>(b.ratio||0)-(a.ratio||0));
    $("signals").innerHTML = hot.length
      ? hot.map(x=>card(x,"hot")).join("")
      : `<div class="panel empty">いま異変はありません。<br><span class="muted">市場を見張っています。</span></div>`;

    const watch = arr
      .filter(x=>!x.hot && x.last != null)
      .sort((a,b)=>((b.ratio||0)*2+(b.change5||0))-((a.ratio||0)*2+(a.change5||0)))
      .slice(0,5);
    $("watch").innerHTML = watch.length
      ? watch.map(x=>card(x,"watch")).join("")
      : `<div class="empty">データ受信待ち…</div>`;
  }

  let ws;
  function connect(){
    const status = $("status");
    ws = new WebSocket("wss://ws-api.coincheck.com/");
    ws.onopen = () => {
      status.textContent = "● LIVE";
      $("diag").textContent = `WebSocket接続済み・${ALL.length}銘柄を監視中`;
      status.className = "status live";
      for(const pair of ALL){
        ws.send(JSON.stringify({type:"subscribe", channel:`${pair}-trades`}));
      }
    };
    ws.onmessage = e => {
      try{
        const data = JSON.parse(e.data);
        if(!Array.isArray(data)) return;
        const rows = Array.isArray(data[0]) ? data : [data];
        for(const r of rows){
          if(!Array.isArray(r) || r.length < 6) continue;
          const pair = String(r[2]);
          const ts = Number(r[0]), price = Number(r[3]), amount = Number(r[4]);
          if(state[pair] && isFinite(ts) && isFinite(price) && isFinite(amount)){
            addTrade(pair, ts, price, amount);
          }
        }
      }catch(_){}
    };
    ws.onclose = () => {
      status.textContent = "再接続中…";
      $("diag").textContent = "接続が切れました。自動再接続します";
      status.className = "status";
      setTimeout(connect, 2500);
    };
    ws.onerror = () => {
      $("diag").textContent = "WebSocket接続エラー。再接続します";
      try{ws.close()}catch(_){}
    };
  }

  connect();
  render();
  setInterval(render, 2000);
})();
</script>
</body>
</html>
