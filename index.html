<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ALT HUNTER v0.9</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#eef5ff}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{margin:0;font-size:32px}
.sub{color:#8ea2bd;font-size:13px;margin-top:5px}
.status{font-size:12px;padding:7px 10px;border:1px solid #26384f;border-radius:999px;color:#b8c7d9}
.status.live{border-color:#1d7456;color:#7de2b6}
.panel,.card{background:#0c1828;border:1px solid #1f3045;border-radius:18px;padding:16px;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metric{background:#101f31;border-radius:12px;padding:10px}
.metric span{display:block;color:#7f95b0;font-size:11px;margin-bottom:4px}
.metric b{font-size:15px}
.grid{display:grid;gap:10px;margin-top:12px}
.coin{font-size:20px;font-weight:800}
.price{font-size:22px;font-weight:700;margin-top:8px}
.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:#11303a;color:#8ce5ef}
.tag.hot{background:#3a2413;color:#ffd08c}
.tag.down{background:#35161b;color:#ff9aa5}
.card.down{border-color:#6b2b36}
.muted{color:#7890ad}
.empty{text-align:center;color:#8298b2;padding:22px}
.footer{margin-top:20px;color:#6f849e;font-size:11px;line-height:1.6}
@media(max-width:620px){.metrics{grid-template-columns:1fr 1fr}.metric:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>ALT HUNTER</h1>
      <div class="sub">Binance市場で監視 → 日本で買えるアルトだけ表示 v0.9</div>
      <div id="diag" class="sub">起動中…</div>
    </div>
    <div id="status" class="status">接続中…</div>
  </div>

  <div class="panel">
    <div class="row">
      <div><strong>🔥 異変レーダー</strong><div class="sub">BinanceのUSDT市場をリアルタイム監視</div></div>
      <div><b id="pairCount">0</b>銘柄</div>
    </div>
    <div class="metrics">
      <div class="metric"><span>異変条件</span><b>出来高 2.0倍</b></div>
      <div class="metric"><span>価格条件</span><b>2分 ±1.0%</b></div>
      <div class="metric"><span>表示対象</span><b>Binance Japan取扱</b></div>
    </div>
  </div>

  <div class="panel">
    <div class="row"><strong>通信診断</strong><span id="wsState" class="muted">未接続</span></div>
    <div class="metrics">
      <div class="metric"><span>購読ストリーム</span><b id="subCount">0</b></div>
      <div class="metric"><span>受信件数</span><b id="msgCount">0</b></div>
      <div class="metric"><span>最終受信</span><b id="lastMsg">—</b></div>
    </div>
  </div>

  <div id="signals" class="grid"></div>

  <div class="panel">
    <div class="row"><strong>👀 動き上位</strong><span class="muted">異変未満も表示</span></div>
    <div id="watch" class="grid"></div>
  </div>

  <div class="footer">
    この版は売買推奨ではなく、チャートを開く候補を探すレーダーです。<br>
    Binance市場のUSDTペアを監視し、日本で買える対象だけ表示します。上昇時は高値まで、下落時は安値までの距離を表示します。
  </div>
</div>

<script>
(() => {
  // Binance Japan取扱銘柄のうち、USDTペア監視に向く主要アルトをまず対象化。
  // v0.7では「確実に動くこと」を優先し、対象は少なめから開始。
  const COINS = [
    "ETH","XRP","BNB","SOL","ADA","AVAX","DOT","LINK","DOGE","SHIB",
    "SUI","PEPE","TRX","MANA","CHZ","IMX","MASK","GRT","FET","TAO",
    "TRB","MEME"
  ];
  const SYMBOLS = COINS.map(c => c.toLowerCase() + "usdt");
  const streams = SYMBOLS.map(s => s + "@aggTrade");
  const url = "wss://stream.binance.com:9443/stream?streams=" + streams.join("/");

  const state = {};
  const MAX_MS = 12*60*1000;
  const MIN_BASELINE_MS = 2*60*1000;
  const VOL_TRIGGER = 2.0;
  const PRICE_TRIGGER = 1.0;

  const $ = id => document.getElementById(id);
  $("pairCount").textContent = COINS.length;
  $("subCount").textContent = streams.length;

  for(const coin of COINS) state[coin] = {trades:[], last:null, firstSeen:null};

  function fmtPrice(v){
    if(v==null) return "—";
    if(v>=1000) return "$"+v.toLocaleString(undefined,{maximumFractionDigits:2});
    if(v>=1) return "$"+v.toLocaleString(undefined,{maximumFractionDigits:4});
    return "$"+v.toLocaleString(undefined,{maximumSignificantDigits:6});
  }
  function pct(v){ return v==null ? "—" : (v>=0?"+":"")+v.toFixed(2)+"%"; }
  function mult(v){ return v==null ? "—" : v.toFixed(2)+"倍"; }

  function addTrade(coin, t, price, qty){
    const s = state[coin];
    if(!s) return;
    if(!s.firstSeen) s.firstSeen = t;
    s.last = price;
    s.trades.push({t, price, usd:price*qty});
    const cutoff = Date.now()-MAX_MS;
    while(s.trades.length && s.trades[0].t<cutoff) s.trades.shift();
  }

  function calc(coin){
    const s = state[coin], now=Date.now(), tr=s.trades;
    if(!tr.length) return {coin,ready:false,last:s.last};

    const vol2 = tr.filter(x=>x.t>=now-2*60_000).reduce((a,x)=>a+x.usd,0);
    const buckets=[];
    for(let i=1;i<=3;i++){
      const end=now-i*2*60_000, start=end-2*60_000;
      if(start >= (s.firstSeen||now)){
        buckets.push(tr.filter(x=>x.t>=start && x.t<end).reduce((a,x)=>a+x.usd,0));
      }
    }
    const nonEmpty=buckets.filter(v=>v>0);
    const baseline=nonEmpty.length?nonEmpty.reduce((a,v)=>a+v,0)/nonEmpty.length:0;
    const ratio=baseline>0?vol2/baseline:null;

    const old2=[...tr].reverse().find(x=>x.t<=now-2*60_000);
    const change2=old2&&s.last?(s.last/old2.price-1)*100:null;

    const tr10=tr.filter(x=>x.t>=now-10*60_000);
    const high10=tr10.length?Math.max(...tr10.map(x=>x.price)):null;
    const low10=tr10.length?Math.min(...tr10.map(x=>x.price)):null;
    const toHigh=s.last&&high10?(high10/s.last-1)*100:null;
    const toLow=s.last&&low10?(s.last/low10-1)*100:null;
    const rangePos=(s.last!=null && high10!=null && low10!=null && high10>low10)
      ? ((s.last-low10)/(high10-low10))*100
      : null;

    const ready=(now-(s.firstSeen||now))>=MIN_BASELINE_MS && ratio!=null && change2!=null;
    const up=ready && ratio>=VOL_TRIGGER && change2>=PRICE_TRIGGER;
    const down=ready && ratio>=VOL_TRIGGER && change2<=-PRICE_TRIGGER;
    const hot=up || down;
    const direction=up ? "up" : down ? "down" : null;
    return {coin,ready,hot,direction,last:s.last,ratio,change2,toHigh,toLow,rangePos};
  }

  function card(d){
    const tag = d.direction==="up"
      ? "🔥 上昇異変"
      : d.direction==="down"
        ? "🔻 下落異変"
        : d.ready
          ? "👀 監視"
          : "準備中";

    const extraClass = d.direction==="up" ? " hot" : d.direction==="down" ? " down" : "";

    return `<div class="card${extraClass}">
      <div class="row">
        <div class="coin">${d.coin}</div>
        <div class="tag ${d.direction==="up"?"hot":d.direction==="down"?"down":""}">${tag}</div>
      </div>
      <div class="price">${fmtPrice(d.last)}</div>
      <div class="metrics">
        <div class="metric"><span>直近2分出来高</span><b>${d.ready?mult(d.ratio):"—"}</b></div>
        <div class="metric"><span>2分価格</span><b>${d.ready?pct(d.change2):"—"}</b></div>
        <div class="metric"><span>${
          d.direction==="up" ? "10分高値まで" :
          d.direction==="down" ? "10分安値まで" :
          "10分レンジ位置"
        }</span><b>${
          !d.ready ? "—" :
          d.direction==="up" && d.toHigh!=null ? d.toHigh.toFixed(2)+"%" :
          d.direction==="down" && d.toLow!=null ? d.toLow.toFixed(2)+"%" :
          d.rangePos!=null ? d.rangePos.toFixed(0)+"%" :
          "—"
        }</b></div>
      </div>
    </div>`;
  }

  function render(){
    const arr=COINS.map(calc);
    const hot=arr.filter(x=>x.hot).sort((a,b)=>(((b.ratio||0)*Math.abs(b.change2||0))-((a.ratio||0)*Math.abs(a.change2||0))));
    $("signals").innerHTML = hot.length ? hot.map(card).join("") :
      `<div class="panel empty">いま異変はありません。市場を見張っています。</div>`;

    const watch=arr.filter(x=>!x.hot && x.last!=null)
      .sort((a,b)=>((b.ratio||0)*2+(b.change2||0))-((a.ratio||0)*2+(a.change2||0)))
      .slice(0,6);
    $("watch").innerHTML = watch.length ? watch.map(card).join("") :
      `<div class="empty">データ受信待ち…</div>`;
  }

  let ws, received=0;
  function connect(){
    $("wsState").textContent="接続中";
    $("diag").textContent="Binance WebSocketへ接続中…";
    ws=new WebSocket(url);

    ws.onopen=()=>{
      $("status").textContent="● LIVE";
      $("status").className="status live";
      $("wsState").textContent="OPEN";
      $("diag").textContent=`${COINS.length}銘柄を監視中`;
    };

    ws.onmessage=e=>{
      received++;
      $("msgCount").textContent=received.toLocaleString("ja-JP");
      $("lastMsg").textContent=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      try{
        const obj=JSON.parse(e.data);
        const d=obj.data||obj;
        if(d && d.e==="aggTrade"){
          const sym=d.s.toUpperCase();
          const coin=sym.replace(/USDT$/,"");
          addTrade(coin, Number(d.T||d.E), Number(d.p), Number(d.q));
        }
      }catch(_){}
    };

    ws.onclose=()=>{
      $("status").textContent="再接続中…";
      $("status").className="status";
      $("wsState").textContent="CLOSED";
      $("diag").textContent="接続が切れました。自動再接続します";
      setTimeout(connect,2500);
    };

    ws.onerror=()=>{
      $("wsState").textContent="ERROR";
      $("diag").textContent="Binance WebSocket接続エラー";
    };
  }

  connect();
  render();
  setInterval(render,2000);
})();
</script>
</body>
</html>
